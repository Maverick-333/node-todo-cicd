version: 0.2

env:
  parameter-store:
    DOCKER_USERNAME: /myapp/docker-credentials/username
    DOCKER_PASSWORD: /myapp/docker-credentials/password
    # DOCKER_REGISTRY_URL: /myapp/docker-registry/url  (If you need it later)
  variables:
    REPOSITORY_NAME: maverick334/test-node-app # Repository name

phases:
  install:
    runtime-versions:
      nodejs: 12.2.0

  pre_build:
    commands:
      - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - if [[ $? -eq 0 ]]; then echo "Docker login successful"; else echo "Docker login failed"; exit 1; fi
      - export IMAGE_URI="$DOCKER_USERNAME/$REPOSITORY_NAME" # Define the full image URI here

  build:
    commands:
      # ... (no changes)
      - docker build -t $IMAGE_URI:latest .

  post_build:
    commands:
      # ... (no changes)
      - docker push $IMAGE_URI:latest
      # ... (no changes)

# ... (rest of your buildspec)
